<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Suivi')}"></head>
<body>
<nav th:replace="~{fragments :: navbar('suivi')}"></nav>
<main class="container">
    <div th:replace="~{fragments :: alerts}"></div>
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
        <div>
            <h2 class="page-title">Suivi des réalisations</h2>
            <p class="page-sub"><span th:text="${affectations.size()}">0</span> affectation(s) affichée(s)</p>
        </div>
        <a class="btn btn-brand" th:href="@{/affectations/nouvelle}"><i class="bi bi-plus-circle me-1"></i>Nouvelle affectation</a>
    </div>

    <div class="card mb-4">
        <div class="card-body">
            <form class="row g-2" th:action="@{/affectations}" method="get">
                <div class="col-md-5">
                    <input class="form-control" name="q" th:value="${q}" placeholder="Rechercher un apprenant ou une activité...">
                </div>
                <div class="col-md-3">
                    <select class="form-select" name="statut">
                        <option value="">Tous les statuts</option>
                        <option th:each="s : ${statuts}" th:value="${s}" th:text="${s.label}" th:selected="${s == statutChoisi}"></option>
                    </select>
                </div>
                <div class="col-md-4 d-flex gap-2">
                    <button class="btn btn-brand"><i class="bi bi-funnel me-1"></i>Filtrer</button>
                    <a class="btn btn-outline-secondary" th:href="@{/affectations}">Réinitialiser</a>
                </div>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr><th>Apprenant</th><th>Activité</th><th>Difficulté</th><th>Date limite</th><th>Statut</th><th>Résultat</th><th class="text-end">Actions</th></tr>
                </thead>
                <tbody>
                <tr th:each="a : ${affectations}" th:classappend="${a.enRetard} ? 'ligne-retard'">
                    <td>
                        <a class="fw-semibold text-decoration-none" th:href="@{/apprenants/{id}(id=${a.apprenant.id})}"
                           th:text="${a.apprenant.prenom} + ' ' + ${a.apprenant.nom}"></a>
                        <div class="small">
                            <span class="text-muted" th:text="'Niveau ' + ${a.apprenant.niveauActuel.label}"></span>
                        </div>
                    </td>
                    <td th:text="${a.activite.titre}"></td>
                    <td><span class="pill" th:classappend="'niv-' + ${a.activite.niveauDifficulte.name()}" th:text="${a.activite.niveauDifficulte.label}"></span></td>
                    <td class="text-nowrap">
                        <span th:text="${a.dateLimite}"></span>
                        <div th:if="${a.enRetard}"><span class="pill pill-retard">En retard</span></div>
                    </td>
                    <td><span class="pill" th:classappend="'st-' + ${a.statut.name()}" th:text="${a.statut.label}"></span></td>
                    <td style="min-width:110px">
                        <div th:if="${a.resultat != null}">
                            <strong th:text="${a.resultat} + ' %'"></strong>
                            <div class="progress mt-1"><div class="progress-bar bg-success" th:style="'width:' + ${a.resultat} + '%'"></div></div>
                        </div>
                        <span th:if="${a.resultat == null}" class="text-muted">-</span>
                    </td>
                    <td class="text-end text-nowrap">
                        <a class="btn btn-sm btn-outline-primary btn-icone" th:href="@{/affectations/{id}/suivi(id=${a.id})}"><i class="bi bi-pencil-square"></i> Suivi</a>
                        <form class="d-inline" sec:authorize="hasRole('ADMIN')" th:action="@{/affectations/{id}/supprimer(id=${a.id})}" method="post"
                              onsubmit="return confirm('Supprimer cette affectation ?')">
                            <button class="btn btn-sm btn-outline-danger btn-icone" title="Supprimer"><i class="bi bi-trash"></i></button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${affectations.isEmpty()}">
                    <td colspan="7"><div class="vide"><i class="bi bi-inbox"></i>Aucune affectation trouvée</div></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
