<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Suivi')}"></head>
<body>
<nav th:replace="~{fragments :: navbar('suivi')}"></nav>
<main class="container" style="max-width:700px">
    <div th:replace="~{fragments :: alerts}"></div>
    <a class="text-decoration-none" th:href="@{/affectations}"><i class="bi bi-arrow-left me-1"></i>Retour au suivi</a>

    <div class="card my-3">
        <div class="card-body">
            <div class="d-flex align-items-center gap-3 mb-3">
                <span class="avatar" th:text="${#strings.toUpperCase(#strings.substring(affectation.apprenant.prenom, 0, 1) + #strings.substring(affectation.apprenant.nom, 0, 1))}"></span>
                <div>
                    <a class="fw-semibold text-decoration-none" th:href="@{/apprenants/{id}(id=${affectation.apprenant.id})}"
                       th:text="${affectation.apprenant.prenom} + ' ' + ${affectation.apprenant.nom}"></a>
                    <div class="small text-muted" th:text="'Groupe ' + ${affectation.apprenant.groupe} + ' · Niveau ' + ${affectation.apprenant.niveauActuel.label}"></div>
                </div>
            </div>
            <h5 class="mb-1" th:text="${affectation.activite.titre}"></h5>
            <div class="mb-2">
                <span class="pill" th:classappend="'niv-' + ${affectation.activite.niveauDifficulte.name()}" th:text="${affectation.activite.niveauDifficulte.label}"></span>
                <span class="text-muted small ms-2" th:text="${affectation.activite.discipline} + ' · ' + ${affectation.activite.dureeEstimee} + ' min'"></span>
            </div>
            <p class="small mb-1" th:if="${affectation.activite.consignes != null and !affectation.activite.consignes.isEmpty()}">
                <strong>Consignes :</strong> <span th:text="${affectation.activite.consignes}"></span>
            </p>
            <div class="small text-muted">
                Affectée le <span th:text="${affectation.dateAffectation}"></span> · Date limite :
                <span th:text="${affectation.dateLimite}"></span>
                <span class="pill pill-retard ms-1" th:if="${affectation.enRetard}">En retard</span>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-header"><i class="bi bi-pencil-square me-2"></i>Mettre à jour le suivi</div>
        <div class="card-body">
            <form th:action="@{/affectations/{id}/suivi(id=${affectation.id})}" method="post">
                <div class="mb-3">
                    <label class="form-label">Statut</label>
                    <select class="form-select" name="statut" id="statut">
                        <option th:each="s : ${statuts}" th:value="${s}" th:text="${s.label}"
                                th:selected="${s == affectation.statut}"></option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Résultat (0 à 100 %) <span class="etoile" id="etoileResultat">*</span></label>
                    <input type="number" class="form-control" name="resultat" id="resultat" min="0" max="100"
                           placeholder="Obligatoire quand l'activité est terminée" th:value="${affectation.resultat}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Commentaire</label>
                    <textarea class="form-control" name="commentaire" rows="3" placeholder="Observation de l'enseignant"
                              th:text="${affectation.commentaire}"></textarea>
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-brand"><i class="bi bi-check2 me-1"></i>Enregistrer</button>
                    <a class="btn btn-outline-secondary" th:href="@{/affectations}">Annuler</a>
                </div>
            </form>
        </div>
    </div>
</main>
<div th:replace="~{fragments :: footer}"></div>
<script>
    var statut = document.getElementById('statut');
    var resultat = document.getElementById('resultat');
    var etoile = document.getElementById('etoileResultat');
    function maj() {
        var termine = statut.value === 'TERMINE';
        resultat.required = termine;
        etoile.style.display = termine ? 'inline' : 'none';
    }
    statut.addEventListener('change', maj);
    maj();
</script>
</body>
</html>
