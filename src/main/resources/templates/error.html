<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Erreur')}"></head>
<body>
<nav th:replace="~{fragments :: navbar('')}"></nav>
<main class="container">
    <div class="erreur-page">
        <div class="code"><i class="bi bi-emoji-frown"></i></div>
        <h2 class="mt-3">Oups, quelque chose ne va pas</h2>
        <p class="text-muted" th:text="${#strings.isEmpty(message)} ? 'La page demandée est introuvable.' : ${message}"></p>
        <a class="btn btn-brand mt-2" th:href="@{/}"><i class="bi bi-house me-1"></i>Retour à l'accueil</a>
    </div>
</main>
<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
