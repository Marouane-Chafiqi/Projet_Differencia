<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(titre)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titre} + ' - Differencia'">Differencia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<nav th:fragment="navbar(actif)" class="navbar navbar-expand-lg navbar-dark navbar-app mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}"><i class="bi bi-mortarboard-fill me-2"></i>Differencia</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" th:classappend="${actif == 'accueil'} ? 'active'" th:href="@{/}"><i class="bi bi-speedometer2 me-1"></i>Tableau de bord</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${actif == 'apprenants'} ? 'active'" th:href="@{/apprenants}"><i class="bi bi-people me-1"></i>Apprenants</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${actif == 'activites'} ? 'active'" th:href="@{/activites}"><i class="bi bi-journal-text me-1"></i>Activités</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${actif == 'suivi'} ? 'active'" th:href="@{/affectations}"><i class="bi bi-list-check me-1"></i>Suivi</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${actif == 'affecter'} ? 'active'" th:href="@{/affectations/nouvelle}"><i class="bi bi-plus-circle me-1"></i>Affecter</a></li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')"><a class="nav-link" th:classappend="${actif == 'utilisateurs'} ? 'active'" th:href="@{/utilisateurs}"><i class="bi bi-shield-lock me-1"></i>Utilisateurs</a></li>
                <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-person-circle me-1"></i><span sec:authentication="name">utilisateur</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><span class="dropdown-item-text small text-muted">
                            <span sec:authorize="hasRole('ADMIN')">Administrateur</span>
                            <span sec:authorize="!hasRole('ADMIN')">Enseignant</span>
                        </span></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" th:href="@{/profil/mot-de-passe}"><i class="bi bi-key me-2"></i>Mot de passe</a></li>
                        <li>
                            <form th:action="@{/logout}" method="post">
                                <button type="submit" class="dropdown-item"><i class="bi bi-box-arrow-right me-2"></i>Déconnexion</button>
                            </form>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>
<div th:fragment="alerts">
    <div class="alert alert-success alert-dismissible fade show" th:if="${message}">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${message}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" th:if="${erreur}">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${erreur}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>
<footer th:fragment="footer" class="app-footer text-center text-muted small py-3 mt-5">
    Differencia · Gestion des activités de pédagogie différenciée
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</footer>
</body>
</html>
