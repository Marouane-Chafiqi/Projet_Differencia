<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Nouvel utilisateur')}"></head>
<body>
<nav th:replace="~{fragments :: navbar('utilisateurs')}"></nav>
<main class="container" style="max-width:640px">
    <div class="card">
        <div class="card-header"><i class="bi bi-person-plus me-2"></i>Nouvel utilisateur</div>
        <div class="card-body">
            <form th:action="@{/utilisateurs/enregistrer}" th:object="${form}" method="post" autocomplete="off">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Nom d'utilisateur <span class="etoile">*</span></label>
                        <input class="form-control" th:field="*{username}" th:errorclass="is-invalid" placeholder="Ex : s.alaoui">
                        <div class="invalid-feedback" th:errors="*{username}"></div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Nom complet <span class="etoile">*</span></label>
                        <input class="form-control" th:field="*{nomComplet}" th:errorclass="is-invalid" placeholder="Ex : Sara Alaoui">
                        <div class="invalid-feedback" th:errors="*{nomComplet}"></div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Mot de passe <span class="etoile">*</span></label>
                        <input class="form-control" type="password" th:field="*{password}" th:errorclass="is-invalid" autocomplete="new-password">
                        <div class="invalid-feedback" th:errors="*{password}"></div>
                        <div class="form-text">8 caractères minimum, avec lettres et chiffres.</div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Confirmation <span class="etoile">*</span></label>
                        <input class="form-control" type="password" th:field="*{confirmation}" th:errorclass="is-invalid" autocomplete="new-password">
                        <div class="invalid-feedback" th:errors="*{confirmation}"></div>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label">Rôle <span class="etoile">*</span></label>
                    <select class="form-select" th:field="*{role}" th:errorclass="is-invalid">
                        <option value="">-- Choisir --</option>
                        <option th:each="r : ${roles}" th:value="${r}" th:text="${r.label}"></option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{role}"></div>
                    <div class="form-text">Un enseignant peut tout faire sauf supprimer des données et gérer les utilisateurs.</div>
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-brand"><i class="bi bi-check2 me-1"></i>Créer le compte</button>
                    <a class="btn btn-outline-secondary" th:href="@{/utilisateurs}">Annuler</a>
                </div>
            </form>
        </div>
    </div>
</main>
<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
