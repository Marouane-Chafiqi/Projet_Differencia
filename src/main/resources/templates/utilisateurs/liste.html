<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Utilisateurs')}"></head>
<body>
<nav th:replace="~{fragments :: navbar('utilisateurs')}"></nav>
<main class="container">
    <div th:replace="~{fragments :: alerts}"></div>
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
        <div>
            <h2 class="page-title">Utilisateurs</h2>
            <p class="page-sub"><span th:text="${utilisateurs.size()}">0</span> compte(s)</p>
        </div>
        <a class="btn btn-brand" th:href="@{/utilisateurs/nouveau}"><i class="bi bi-person-plus me-1"></i>Nouvel utilisateur</a>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead><tr><th>Utilisateur</th><th>Rôle</th><th>Statut</th><th>Créé le</th><th class="text-end">Actions</th></tr></thead>
                <tbody>
                <tr th:each="u : ${utilisateurs}">
                    <td>
                        <div class="d-flex align-items-center gap-3">
                            <span class="avatar" th:text="${#strings.toUpperCase(#strings.substring(u.username, 0, 1))}"></span>
                            <div>
                                <div class="fw-semibold">
                                    <span th:text="${u.nomComplet}"></span>
                                    <span class="badge text-bg-light ms-1" th:if="${u.username.equalsIgnoreCase(moi)}">Vous</span>
                                </div>
                                <small class="text-muted" th:text="${u.username}"></small>
                            </div>
                        </div>
                    </td>
                    <td><span class="pill" th:classappend="'pill-role-' + ${u.role.name()}" th:text="${u.role.label}"></span></td>
                    <td>
                        <span class="pill pill-actif" th:if="${u.actif}">Actif</span>
                        <span class="pill pill-inactif" th:unless="${u.actif}">Désactivé</span>
                    </td>
                    <td th:text="${u.dateCreationFormatee}"></td>
                    <td class="text-end text-nowrap">
                        <th:block th:unless="${u.username.equalsIgnoreCase(moi)}">
                            <form class="d-inline" th:action="@{/utilisateurs/{id}/basculer(id=${u.id})}" method="post">
                                <button class="btn btn-sm btn-outline-secondary btn-icone" th:title="${u.actif} ? 'Désactiver' : 'Activer'">
                                    <i class="bi" th:classappend="${u.actif} ? 'bi-person-slash' : 'bi-person-check'"></i>
                                </button>
                            </form>
                            <form class="d-inline" th:action="@{/utilisateurs/{id}/supprimer(id=${u.id})}" method="post"
                                  onsubmit="return confirm('Supprimer cet utilisateur ?')">
                                <button class="btn btn-sm btn-outline-danger btn-icone" title="Supprimer"><i class="bi bi-trash"></i></button>
                            </form>
                        </th:block>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
