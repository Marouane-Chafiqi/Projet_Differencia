<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Mot de passe')}"></head>
<body>
<nav th:replace="~{fragments :: navbar('')}"></nav>
<main class="container" style="max-width:520px">
    <div class="card">
        <div class="card-header"><i class="bi bi-key me-2"></i>Changer mon mot de passe</div>
        <div class="card-body">
            <form th:action="@{/profil/mot-de-passe}" th:object="${form}" method="post" autocomplete="off">
                <div class="mb-3">
                    <label class="form-label">Mot de passe actuel <span class="etoile">*</span></label>
                    <input class="form-control" type="password" th:field="*{ancien}" th:errorclass="is-invalid" autocomplete="current-password">
                    <div class="invalid-feedback" th:errors="*{ancien}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Nouveau mot de passe <span class="etoile">*</span></label>
                    <input class="form-control" type="password" th:field="*{nouveau}" th:errorclass="is-invalid" autocomplete="new-password">
                    <div class="invalid-feedback" th:errors="*{nouveau}"></div>
                    <div class="form-text">8 caractères minimum, avec lettres et chiffres.</div>
                </div>
                <div class="mb-4">
                    <label class="form-label">Confirmer le nouveau mot de passe <span class="etoile">*</span></label>
                    <input class="form-control" type="password" th:field="*{confirmation}" th:errorclass="is-invalid" autocomplete="new-password">
                    <div class="invalid-feedback" th:errors="*{confirmation}"></div>
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-brand"><i class="bi bi-check2 me-1"></i>Enregistrer</button>
                    <a class="btn btn-outline-secondary" th:href="@{/}">Annuler</a>
                </div>
            </form>
        </div>
    </div>
</main>
<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
