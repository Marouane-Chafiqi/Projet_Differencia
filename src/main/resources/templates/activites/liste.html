<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Activités')}"></head>
<body>
<nav th:replace="~{fragments :: navbar('activites')}"></nav>
<main class="container">
    <div th:replace="~{fragments :: alerts}"></div>
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
        <div>
            <h2 class="page-title">Catalogue des activités</h2>
            <p class="page-sub"><span th:text="${activites.size()}">0</span> activité(s) affichée(s)</p>
        </div>
        <a class="btn btn-brand" th:href="@{/activites/nouvelle}"><i class="bi bi-plus-circle me-1"></i>Nouvelle activité</a>
    </div>

    <div class="card mb-4">
        <div class="card-body">
            <form class="row g-2" th:action="@{/activites}" method="get">
                <div class="col-md-5">
                    <input class="form-control" name="q" th:value="${q}" placeholder="Rechercher par titre ou discipline...">
                </div>
                <div class="col-md-3">
                    <select class="form-select" name="niveau">
                        <option value="">Toutes les difficultés</option>
                        <option th:each="n : ${niveaux}" th:value="${n}" th:text="${n.label}" th:selected="${n == niveauChoisi}"></option>
                    </select>
                </div>
                <div class="col-md-4 d-flex gap-2">
                    <button class="btn btn-brand"><i class="bi bi-funnel me-1"></i>Filtrer</button>
                    <a class="btn btn-outline-secondary" th:href="@{/activites}">Réinitialiser</a>
                </div>
            </form>
        </div>
    </div>

    <div class="row g-3">
        <div class="col-md-6 col-xl-4" th:each="a : ${activites}">
            <div class="card activite-card">
                <div class="card-body d-flex flex-column">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <span class="pill" th:classappend="'niv-' + ${a.niveauDifficulte.name()}" th:text="${a.niveauDifficulte.label}"></span>
                        <span class="text-muted small"><i class="bi bi-clock me-1"></i><span th:text="${a.dureeEstimee} + ' min'"></span></span>
                    </div>
                    <h5 class="mb-1" th:text="${a.titre}"></h5>
                    <div class="text-muted small mb-2"><i class="bi bi-bookmark me-1"></i><span th:text="${a.discipline}"></span></div>
                    <p class="small mb-1" th:if="${a.objectifPedagogique != null and !a.objectifPedagogique.isEmpty()}">
                        <strong>Objectif :</strong> <span th:text="${a.objectifPedagogique}"></span>
                    </p>
                    <p class="small text-muted" th:if="${a.consignes != null and !a.consignes.isEmpty()}" th:text="${a.consignes}"></p>
                    <div class="mt-auto pt-2 d-flex gap-2">
                        <a class="btn btn-sm btn-outline-primary" th:href="@{/activites/{id}/modifier(id=${a.id})}"><i class="bi bi-pencil me-1"></i>Modifier</a>
                        <form class="d-inline" sec:authorize="hasRole('ADMIN')" th:action="@{/activites/{id}/supprimer(id=${a.id})}" method="post"
                              onsubmit="return confirm('Supprimer cette activité ?')">
                            <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash me-1"></i>Supprimer</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-12" th:if="${activites.isEmpty()}">
            <div class="card"><div class="vide"><i class="bi bi-journal-x"></i>Aucune activité trouvée</div></div>
        </div>
    </div>
</main>
<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
