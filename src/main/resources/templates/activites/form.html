<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Activité')}"></head>
<body>
<nav th:replace="~{fragments :: navbar('activites')}"></nav>
<main class="container" style="max-width:720px">
    <div class="card">
        <div class="card-header">
            <i class="bi bi-journal-text me-2"></i><span th:if="${activite.id == null}">Nouvelle activité</span><span th:if="${activite.id != null}">Modifier l'activité</span>
        </div>
        <div class="card-body">
            <form th:action="@{/activites/enregistrer}" th:object="${activite}" method="post">
                <input type="hidden" th:field="*{id}">
                <div class="row">
                    <div class="col-md-7 mb-3">
                        <label class="form-label">Titre <span class="etoile">*</span></label>
                        <input class="form-control" th:field="*{titre}" th:errorclass="is-invalid" placeholder="Ex : Additions simples">
                        <div class="invalid-feedback" th:errors="*{titre}"></div>
                    </div>
                    <div class="col-md-5 mb-3">
                        <label class="form-label">Discipline <span class="etoile">*</span></label>
                        <input class="form-control" th:field="*{discipline}" th:errorclass="is-invalid" placeholder="Ex : Mathématiques">
                        <div class="invalid-feedback" th:errors="*{discipline}"></div>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Objectif pédagogique</label>
                    <textarea class="form-control" rows="2" th:field="*{objectifPedagogique}" placeholder="Ce que l'apprenant doit maîtriser"></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">Consignes</label>
                    <textarea class="form-control" rows="3" th:field="*{consignes}" placeholder="Description des tâches à réaliser"></textarea>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Niveau de difficulté <span class="etoile">*</span></label>
                        <select class="form-select" th:field="*{niveauDifficulte}" th:errorclass="is-invalid">
                            <option value="">-- Choisir --</option>
                            <option th:each="n : ${niveaux}" th:value="${n}" th:text="${n.label}"></option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{niveauDifficulte}"></div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Durée estimée (minutes) <span class="etoile">*</span></label>
                        <input type="number" min="1" class="form-control" th:field="*{dureeEstimee}" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:errors="*{dureeEstimee}"></div>
                    </div>
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-brand"><i class="bi bi-check2 me-1"></i>Enregistrer</button>
                    <a class="btn btn-outline-secondary" th:href="@{/activites}">Annuler</a>
                </div>
            </form>
        </div>
    </div>
</main>
<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
