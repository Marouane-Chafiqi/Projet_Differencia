spring.datasource.url=jdbc:mysql://localhost:3306/differencia?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ---------- Sécurité ----------
# Compte administrateur créé au premier démarrage (si la table utilisateur est vide)
app.admin.username=admin
app.admin.password=Admin@12345
# Compte de démonstration "prof" / "Prof@12345" (mettre false en production)
app.demo-users=true
# Clé secrète du cookie "Se souvenir de moi" : à remplacer en production (variable d'environnement conseillée)
app.security.remember-me-key=${REMEMBER_ME_KEY:differencia-dev-key-changez-moi}

# Session : 30 min d'inactivité, cookie inaccessible au JavaScript
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Mettre à true si l'application est servie en HTTPS
server.servlet.session.cookie.secure=false
